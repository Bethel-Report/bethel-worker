services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bethel-worker
    environment:
      RABBITMQ_HOST: bethel-message-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - net1

networks:
  net1:
    external: true
